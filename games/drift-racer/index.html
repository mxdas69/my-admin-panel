<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drift Racer</title>
<style>
html,body{margin:0;height:100%;background:#0d1410;color:#f3f6ef;font-family:system-ui,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
.ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1410d9;padding:16px}
.card{background:#18241c;border:1px solid #33503d;border-radius:18px;padding:26px;max-width:440px;text-align:center}
h1{margin:0 0 6px;font:900 46px/1 "Arial Black",system-ui}h1 b{color:#ff5a3c}
p{color:#a9c2ae;line-height:1.5;margin:8px 0 14px}
button{font:800 17px system-ui;border:0;border-radius:10px;padding:12px 18px;margin:4px;cursor:pointer;background:#25382b;color:#f3f6ef}
button.y{background:#ff5a3c;color:#2a0800}
button:focus-visible{outline:3px solid #ff5a3c;outline-offset:2px}
.keys{font-size:13px;color:#a9c2ae;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:12px 0 18px}
kbd{background:#25382b;border-radius:5px;padding:1px 6px;color:#f3f6ef;font-weight:700;font-family:inherit}
a.back{position:fixed;left:12px;top:10px;color:#a9c2ae;text-decoration:none;font:700 14px system-ui;z-index:5;background:#18241ccc;padding:6px 12px;border-radius:999px}
[hidden]{display:none!important}
</style>
</head>
<body>
<a class="back" href="../index.html">‹ Games</a>
<canvas id="c"></canvas>
<div class="ui" id="menu"><div class="card">
  <h1>Drift <b>Racer</b></h1>
  <p id="sub">Three laps against three rivals. Pull the handbrake into corners and slide through them.</p>
  <div class="keys"><kbd>W</kbd> <kbd>↑</kbd><span>Accelerate</span><kbd>S</kbd> <kbd>↓</kbd><span>Brake and reverse</span><kbd>A D</kbd> <kbd>← →</kbd><span>Steer</span><kbd>Space</kbd><span>Handbrake: drift</span></div>
  <div><button class="y" data-m="race">Race</button><button data-m="trial">Time trial</button></div>
  <p id="best" style="font-size:13px;margin-bottom:0"></p>
</div></div>
<script>
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d'),menu=document.getElementById('menu');
const clamp=(x,a,b)=>x<a?a:x>b?b:x,rnd=(a,b)=>a+Math.random()*(b-a);
let DPR=1;function resize(){DPR=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();});addEventListener('keyup',e=>{keys[e.code]=false;});
const best=(()=>{try{return JSON.parse(localStorage.getItem('driftRacer')||'{}');}catch(e){return{};}})();
const saveBest=()=>{try{localStorage.setItem('driftRacer',JSON.stringify(best));}catch(e){}};
/* Track: a closed spline through these points, sampled into a centre line */
const CP=[[0,0],[900,-80],[1500,180],[1750,700],[1450,1150],[900,1050],[600,1450],[0,1500],[-500,1150],[-350,650],[-800,350],[-600,-50]];
const HALF=95,N=520,LINE=[];
(function(){const cr=(a,b,c,d,t)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
  for(let i=0;i<N;i++){const u=i/N*CP.length,k=Math.floor(u),t=u-k,P=j=>CP[(k+j+CP.length)%CP.length];LINE.push([cr(P(-1)[0],P(0)[0],P(1)[0],P(2)[0],t),cr(P(-1)[1],P(0)[1],P(1)[1],P(2)[1],t)]);}})();
const curv=LINE.map((p,i)=>{const a=LINE[(i+N-6)%N],b=LINE[(i+6)%N],a1=Math.atan2(p[1]-a[1],p[0]-a[0]),a2=Math.atan2(b[1]-p[1],b[0]-p[0]);let d=Math.abs(a2-a1);if(d>Math.PI)d=Math.PI*2-d;return d;});
function nearest(x,y,hint){let bi=hint,bd=1e18;for(let k=-40;k<=40;k++){const i=(hint+k+N)%N,dx=LINE[i][0]-x,dy=LINE[i][1]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i;}}return[bi,Math.sqrt(bd)];}
/* Cars */
const COLS=['#ff5a3c','#3cb4ff','#ffd23c','#b45aff'];
let cars=[],me,state='menu',mode='race',t=0,raceT=0,count=0,parts=[],skid=null,lapStart=0,lapBest=0,finishOrder=[],last=performance.now();
const startHead=Math.atan2(LINE[3][1]-LINE[0][1],LINE[3][0]-LINE[0][0]);
function mkCar(i,ai){const back=i*2+1,s=LINE[(N-back*14)%N],nx=-Math.sin(startHead),ny=Math.cos(startHead),side=(i%2?1:-1)*40;
  return{i,ai,x:s[0]+nx*side,y:s[1]+ny*side,h:startHead,vx:0,vy:0,w:0,idx:(N-back*14)%N,lap:0,prog:0,done:false,time:0,col:COLS[i],skill:ai?rnd(.9,1.02):1,drift:0};}
function start(m){mode=m;cars=[mkCar(0,false)];if(m==='race')for(let i=1;i<4;i++)cars.push(mkCar(i,true));me=cars[0];
  state='count';count=3.2;raceT=0;lapBest=0;finishOrder=[];parts=[];
  skid=document.createElement('canvas');skid.width=3200;skid.height=2400;menu.hidden=true;}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(b.dataset.m));
const fmt=s=>Math.floor(s/60)+':'+(s%60).toFixed(2).padStart(5,'0');
function showBest(){document.getElementById('best').textContent=best.lap?'Best lap '+fmt(best.lap):'';}showBest();
function drive(c,dt,I){
  const fx=Math.cos(c.h),fy=Math.sin(c.h),rx=-fy,ry=fx;
  let vf=c.vx*fx+c.vy*fy,vr=c.vx*rx+c.vy*ry;
  const [,off]=nearest(c.x,c.y,c.idx),grass=off>HALF;
  if(I.up)vf+=(vf<0?900:560)*dt;
  if(I.dn)vf-=(vf>0?950:380)*dt;
  vf*=1-(grass?1.6:.35)*dt;vf=clamp(vf,-220,grass?380:760*c.skill);
  const grip=I.hb?1.6:grass?4:9;vr*=Math.exp(-grip*dt);
  const steer=(I.r?1:0)-(I.l?1:0),turn=steer*2.7*clamp(Math.abs(vf)/220,0,1)*Math.sign(vf||1)*(I.hb?1.35:1);
  c.w+=(turn-c.w)*Math.min(1,dt*10);c.h+=c.w*dt;
  if(I.hb)vf*=1-.6*dt;
  c.vx=fx*vf+rx*vr;c.vy=fy*vf+ry*vr;c.x+=c.vx*dt;c.y+=c.vy*dt;
  c.drift=Math.abs(vr);
  // Track edge: past the kerb the car is shoved back and loses speed
  const[ni,d]=nearest(c.x,c.y,c.idx);
  if(d>HALF+60){const p=LINE[ni],k=(HALF+60)/d;c.x=p[0]+(c.x-p[0])*k;c.y=p[1]+(c.y-p[1])*k;c.vx*=.5;c.vy*=.5;}
  // Progress round the lap
  let step=ni-c.idx;if(step<-N/2)step+=N;if(step>N/2)step-=N;
  c.prog+=step;c.idx=ni;
  if(c.prog>=N){c.prog-=N;c.lap++;if(!c.ai){const lt=raceT-lapStart;lapStart=raceT;if(c.lap>=1&&(!lapBest||lt<lapBest))lapBest=lt;if(c.lap>=1&&(!best.lap||lt<best.lap)){best.lap=lt;saveBest();}}}
  if(c.prog<-N*.5){c.prog+=N;c.lap--;}
  if(c.drift>140&&Math.abs(vf)>150){if(Math.random()<.5)parts.push({x:c.x-fx*20,y:c.y-fy*20,vx:rnd(-30,30),vy:rnd(-30,30),t:.9,r:8});
    const sg=skid.getContext('2d');sg.fillStyle='rgba(20,20,20,.25)';for(const s of[-1,1])sg.fillRect(c.x-fx*20+rx*s*11+1600-2,c.y-fy*20+ry*s*11+1200-2,4,4);}
}
function aiInput(c){
  const look=(c.idx+22)%N,tp=LINE[look],a=Math.atan2(tp[1]-c.y,tp[0]-c.x);let da=((a-c.h+Math.PI*3)%(Math.PI*2))-Math.PI;
  let k=0;for(let j=0;j<40;j+=4)k=Math.max(k,curv[(c.idx+j)%N]);
  const sp=Math.hypot(c.vx,c.vy),want=clamp(760-k*1700,330,740)*c.skill;
  return{l:da<-.05,r:da>.05,up:sp<want,dn:sp>want+60,hb:false};
}
function update(dt){
  t+=dt;for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=14*dt;p.t-=dt;}parts=parts.filter(p=>p.t>0);
  if(state==='count'){count-=dt;if(count<=0){state='race';lapStart=0;}return;}
  if(state!=='race'&&state!=='done')return;
  raceT+=dt;
  for(const c of cars){
    const I=c.ai?aiInput(c):{up:keys.KeyW||keys.ArrowUp,dn:keys.KeyS||keys.ArrowDown,l:keys.KeyA||keys.ArrowLeft,r:keys.KeyD||keys.ArrowRight,hb:keys.Space};
    if(c.done){I.up=false;I.dn=Math.hypot(c.vx,c.vy)>30;I.hb=false;}
    drive(c,dt,I);
    if(!c.done&&c.lap>=3){c.done=true;c.time=raceT;finishOrder.push(c);}
  }
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<34&&d>0){const o=(34-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){a.vx+=rv*nx*.5;a.vy+=rv*ny*.5;b.vx-=rv*nx*.5;b.vy-=rv*ny*.5;}}}
  if(state==='race'&&me.done){state='done';setTimeout(()=>{const pos=finishOrder.indexOf(me)+1;menu.hidden=false;
    document.getElementById('sub').textContent=(mode==='race'?['1st!','2nd','3rd','4th'][pos-1]+' place. ':'')+'Time '+fmt(me.time)+(lapBest?' · best lap '+fmt(lapBest):'');showBest();},1200);}
}
function place(){return cars.slice().sort((a,b)=>(b.lap*N+b.prog)-(a.lap*N+a.prog)).indexOf(me)+1;}
function draw(){
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#1c3a22';g.fillRect(0,0,cv.width,cv.height);
  if(!me){return;}
  const z=Math.min(cv.width/1500,cv.height/950)*1.05,cx=me.x+me.vx*.35,cy=me.y+me.vy*.35;
  g.setTransform(z,0,0,z,cv.width/2-cx*z,cv.height/2-cy*z);
  g.fillStyle='#22462a';for(let x=-1400;x<2400;x+=200)for(let y=-700;y<2200;y+=200)if(((x+y)/200)%2===0)g.fillRect(x,y,200,200);
  const path=()=>{g.beginPath();LINE.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();};
  g.lineJoin='round';path();g.strokeStyle='#e8e8e8';g.lineWidth=HALF*2+22;g.stroke();
  g.setLineDash([40,40]);g.strokeStyle='#d8382a';g.stroke();g.setLineDash([]);
  path();g.strokeStyle='#3a3d42';g.lineWidth=HALF*2;g.stroke();
  g.setLineDash([30,40]);path();g.strokeStyle='#ffffff30';g.lineWidth=4;g.stroke();g.setLineDash([]);
  g.drawImage(skid,-1600,-1200);
  const s0=LINE[0],nx=-Math.sin(startHead),ny=Math.cos(startHead);
  for(let k=-5;k<5;k++)for(let r=0;r<2;r++){g.fillStyle=(k+r)%2?'#fff':'#111';const px=s0[0]+nx*(k*19)+Math.cos(startHead)*r*19,py=s0[1]+ny*(k*19)+Math.sin(startHead)*r*19;g.fillRect(px-9.5,py-9.5,19,19);}
  for(const p of parts){g.globalAlpha=clamp(p.t,0,1)*.35;g.fillStyle='#ddd';g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill();}g.globalAlpha=1;
  for(const c of cars){g.save();g.translate(c.x,c.y);g.rotate(c.h);g.fillStyle='#0006';g.fillRect(-21,-11,44,26);g.fillStyle=c.col;g.beginPath();g.roundRect?g.roundRect(-22,-12,44,24,6):g.rect(-22,-12,44,24);g.fill();
    g.fillStyle='#111a';g.fillRect(-4,-9,12,18);g.fillStyle='#fffbe0';g.fillRect(18,-10,4,6);g.fillRect(18,4,4,6);g.fillStyle='#111';for(const[a,b]of[[-16,-14],[10,-14],[-16,11],[10,11]])g.fillRect(a,b,9,4);g.restore();}
  // HUD
  g.setTransform(DPR,0,0,DPR,0,0);const w=innerWidth;
  g.fillStyle='#000a';g.fillRect(w-230,12,218,mode==='race'?92:70);g.fillStyle='#fff';g.font='900 26px system-ui';g.textAlign='left';
  g.fillText('Lap '+Math.min(3,me.lap+1)+'/3',w-216,44);g.font='700 15px system-ui';g.fillStyle='#cfe0d2';g.fillText(fmt(raceT)+(lapBest?'  best '+fmt(lapBest):''),w-216,68);
  if(mode==='race'){g.fillStyle='#ffd23c';g.font='900 22px system-ui';g.fillText(['1st','2nd','3rd','4th'][place()-1],w-216,94);}
  g.fillStyle='#000a';g.fillRect(16,innerHeight-62,160,46);g.fillStyle='#fff';g.font='900 26px system-ui';g.fillText(Math.round(Math.hypot(me.vx,me.vy)*.36)+' km/h',28,innerHeight-30);
  if(me.drift>140){g.fillStyle='#ffd23c';g.font='900 20px system-ui';g.fillText('DRIFT',190,innerHeight-30);}
  // minimap
  const mm=150,mx=w-mm-20,my=innerHeight-mm-20;g.fillStyle='#0008';g.fillRect(mx-8,my-8,mm+16,mm+16);
  const mz=mm/2600;g.strokeStyle='#888';g.lineWidth=4;g.beginPath();LINE.forEach((p,i)=>{const X=mx+(p[0]+900)*mz,Y=my+(p[1]+250)*mz;i?g.lineTo(X,Y):g.moveTo(X,Y);});g.closePath();g.stroke();
  for(const c of cars){g.fillStyle=c.col;g.beginPath();g.arc(mx+(c.x+900)*mz,my+(c.y+250)*mz,c===me?5:4,0,6.283);g.fill();}
  if(state==='count'){g.fillStyle='#fff';g.font='900 90px "Arial Black",system-ui';g.textAlign='center';g.fillText(count>.6?String(Math.ceil(count-.6)):'GO!',w/2,innerHeight/2-60);}
}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();}
requestAnimationFrame(loop);
window.__dr={start,get me(){return me;},get state(){return state;},keys,update,get cars(){return cars;}};
</script>
</body>
</html>
